name: Publicar release Android

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: contagem_fisica
        run: flutter pub get

      - name: Analise
        working-directory: contagem_fisica
        run: flutter analyze

      - name: Testes
        working-directory: contagem_fisica
        run: flutter test

      - name: Build APK
        working-directory: contagem_fisica
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://backend-production-3a35.up.railway.app' }}
          APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
        run: |
          if [ -n "$APP_API_TOKEN" ]; then
            flutter build apk --release \
              --dart-define=BACKEND_URL="$BACKEND_URL" \
              --dart-define=APP_API_TOKEN="$APP_API_TOKEN"
          else
            flutter build apk --release
          fi

      - name: Notas da release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 == "## " version { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' contagem_fisica/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: contagem_fisica/build/app/outputs/flutter-apk/app-release.apk
          body_path: release-notes.md
