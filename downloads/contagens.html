<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contagem Física HMB - Contagens Publicadas</title>
  <meta name="theme-color" content="#1565C0" />
  <style>
    :root {
      --azul: #1565C0;
      --azul-escuro: #0D47A1;
      --verde: #2E7D32;
      --cinza: #424242;
      --muted: #757575;
      --fundo: #F5F7FA;
      --borda: #E0E0E0;
      --erro: #B00020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--fundo);
      color: var(--cinza);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--borda);
    }
    .topbar {
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      color: var(--azul-escuro);
      font-size: 21px;
      line-height: 1.2;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .back {
      flex: 0 0 auto;
      color: var(--azul);
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: #fff;
      color: var(--cinza);
      font-size: 15px;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .card h2 {
      margin: 0;
      color: var(--azul-escuro);
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 8px;
      align-items: stretch;
    }
    .file-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px;
      min-width: 0;
    }
    .btn, .icon-btn {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--azul);
      background: var(--azul);
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .icon-btn {
      padding: 0;
      background: #fff;
      color: var(--azul);
      font-size: 20px;
    }
    .btn:hover { background: var(--azul-escuro); }
    .icon-btn:hover { background: #E3F2FD; color: var(--azul-escuro); }
    .empty, .error {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }
    .error {
      color: var(--erro);
      border-color: #F5B7C2;
    }
    .badge {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: #F8FAFC;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 10px;
    }
    dialog {
      width: min(420px, calc(100% - 24px));
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 0;
      color: var(--cinza);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .35); }
    .modal {
      padding: 16px;
      display: grid;
      gap: 12px;
      text-align: center;
    }
    .modal h2 {
      margin: 0;
      color: var(--azul-escuro);
      font-size: 18px;
    }
    .qr {
      width: 256px;
      height: 256px;
      margin: 0 auto;
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ghost {
      background: #fff;
      color: var(--azul);
    }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .toolbar { grid-template-columns: 1fr; }
      .status { white-space: normal; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>Contagens Publicadas</h1>
        <p>Baixe a planilha, pacote ZIP ou PDF gerado no app.</p>
      </div>
      <div class="header-actions">
        <a class="back" href="https://backend-production-3a35.up.railway.app/">Painel completo</a>
        <a class="back" href="index.html">Voltar ao app</a>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="busca" type="search" placeholder="Buscar por operador, matricula, data ou arquivo" autocomplete="off" />
      <div id="status" class="status">Carregando contagens...</div>
    </div>

    <section id="lista" class="grid" aria-live="polite"></section>
    <div id="mensagem" class="empty" hidden></div>
  </main>

  <dialog id="qrDialog">
    <div class="modal">
      <h2 id="qrTitulo">QR code</h2>
      <img id="qrImg" class="qr" alt="QR code para baixar contagem" />
      <a id="qrLink" class="btn" href="#" target="_blank" rel="noopener">Abrir arquivo</a>
      <button id="fecharQr" class="btn ghost" type="button">Fechar</button>
    </div>
  </dialog>

  <script src="contagens/config.js"></script>
  <script>
    const MANIFEST_URL = "contagens/manifest.json";
    const API_URL = window.CONTAGENS_API_URL || "";
    const PAGES_BASE = "https://hendelsantos.github.io/app_contagem_fisica_submaterial/";
    const lista = document.getElementById("lista");
    const busca = document.getElementById("busca");
    const statusEl = document.getElementById("status");
    const mensagem = document.getElementById("mensagem");
    const qrDialog = document.getElementById("qrDialog");
    const qrTitulo = document.getElementById("qrTitulo");
    const qrImg = document.getElementById("qrImg");
    const qrLink = document.getElementById("qrLink");
    const fecharQr = document.getElementById("fecharQr");
    let contagens = [];

    function urlPublica(arquivo) {
      return new URL(arquivo, PAGES_BASE).href;
    }

    function textoBusca(item) {
      return [
        item.titulo,
        item.operador,
        item.matricula,
        item.data,
        item.tipo,
        item.arquivo,
        item.arquivos?.excel,
        item.arquivos?.zip,
        item.arquivos?.pdf,
        item.status,
        item.observacao
      ].join(" ").toLowerCase();
    }

    function formatarData(valor) {
      if (!valor) return "";
      const data = new Date(`${valor}T00:00:00`);
      if (Number.isNaN(data.getTime())) return valor;
      return data.toLocaleDateString("pt-BR");
    }

    function mostrarMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? "error" : "empty";
      mensagem.hidden = false;
      lista.innerHTML = "";
    }

    function esconderMensagem() {
      mensagem.hidden = true;
      mensagem.textContent = "";
    }

    function arquivosDaContagem(item) {
      const arquivos = [];
      if (item.arquivos && typeof item.arquivos === "object") {
        if (item.arquivos.excel) arquivos.push({ tipo: "Excel", arquivo: item.arquivos.excel });
        if (item.arquivos.zip) arquivos.push({ tipo: "ZIP", arquivo: item.arquivos.zip });
        if (item.arquivos.pdf) arquivos.push({ tipo: "PDF", arquivo: item.arquivos.pdf });
      }
      if (item.arquivo) arquivos.push({ tipo: item.tipo || "Arquivo", arquivo: item.arquivo });
      return arquivos;
    }

    function abrirQr(item, arquivo) {
      const link = urlPublica(arquivo.arquivo);
      qrTitulo.textContent = `${arquivo.tipo} - ${item.titulo || "Contagem"}`;
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&qzone=4&data=${encodeURIComponent(link)}`;
      qrLink.href = link;
      qrDialog.showModal();
    }

    function card(item) {
      const article = document.createElement("article");
      article.className = "card";

      const titulo = document.createElement("h2");
      titulo.textContent = item.titulo || item.arquivo?.split("/").pop() || "Contagem recebida";

      const meta = document.createElement("div");
      meta.className = "meta";
      const linhas = [
        item.operador ? `Operador: ${item.operador}${item.matricula ? ` (${item.matricula})` : ""}` : "",
        item.data ? `Data: ${formatarData(item.data)}` : "",
        item.turno ? `Turno: ${item.turno}` : "",
        item.status ? `Status: ${item.status}` : "",
        item.totalMateriais ? `Materiais: ${item.totalMateriais}` : "",
        item.alertas || item.bloqueios ? `Alertas: ${item.alertas || 0} | Bloqueios: ${item.bloqueios || 0}` : "",
        item.totalContado ? `Total contado: ${item.totalContado}` : "",
        item.totalRecebido ? `Total recebido: ${item.totalRecebido}` : "",
        item.observacao || ""
      ].filter(Boolean);
      linhas.forEach((linha) => {
        const span = document.createElement("span");
        span.textContent = linha;
        meta.appendChild(span);
      });

      const actions = document.createElement("div");
      actions.className = "actions";

      const arquivos = arquivosDaContagem(item);
      arquivos.forEach((arquivo) => {
        const row = document.createElement("div");
        row.className = "file-row";

        const link = document.createElement("a");
        link.className = "btn";
        link.href = urlPublica(arquivo.arquivo);
        link.target = "_blank";
        link.rel = "noopener";
        link.download = "";
        link.textContent = arquivo.tipo;

        const qr = document.createElement("button");
        qr.className = "icon-btn";
        qr.type = "button";
        qr.title = `Mostrar QR code do ${arquivo.tipo}`;
        qr.setAttribute("aria-label", `Mostrar QR code do ${arquivo.tipo}`);
        qr.textContent = "QR";
        qr.addEventListener("click", () => abrirQr(item, arquivo));

        row.append(link, qr);
        actions.appendChild(row);
      });

      if (arquivos.length === 0) {
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "Recebida online pelo app";
        actions.appendChild(badge);
      }

      article.append(titulo, meta, actions);
      return article;
    }

    function render() {
      const termo = busca.value.trim().toLowerCase();
      const filtradas = termo
        ? contagens.filter((item) => textoBusca(item).includes(termo))
        : contagens;

      if (filtradas.length === 0) {
        mostrarMensagem(contagens.length === 0
          ? "Nenhuma contagem publicada ainda."
          : "Nenhuma contagem encontrada para esta busca.");
        statusEl.textContent = contagens.length === 1 ? "1 contagem" : `${contagens.length} contagens`;
        return;
      }

      esconderMensagem();
      lista.innerHTML = "";
      filtradas.forEach((item) => lista.appendChild(card(item)));
      statusEl.textContent = filtradas.length === 1 ? "1 contagem" : `${filtradas.length} contagens`;
    }

    function carregarManifest() {
      return fetch(MANIFEST_URL, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("manifest");
          return response.json();
        })
        .then((data) => {
          contagens = Array.isArray(data.contagens) ? data.contagens : [];
          render();
        });
    }

    function carregarApi() {
      if (!API_URL) return carregarManifest();
      return fetch(API_URL, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("api");
          return response.json();
        })
        .then((data) => {
          contagens = Array.isArray(data.contagens) ? data.contagens : [];
          render();
        })
        .catch(() => carregarManifest());
    }

    carregarApi()
      .catch(() => {
        mostrarMensagem("Nao foi possivel carregar a lista de contagens. Confira a API ou o arquivo contagens/manifest.json.", true);
        statusEl.textContent = "Erro ao carregar";
      });

    busca.addEventListener("input", render);
    fecharQr.addEventListener("click", () => qrDialog.close());
  </script>
</body>
</html>
