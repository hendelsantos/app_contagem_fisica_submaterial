name: contagem_fisica
description: "App Flutter offline de contagem física de materiais (anti-erro) com exportação Excel compatível com o Streamlit HMB."
publish_to: 'none'
version: 0.3.3+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado / roteamento
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegação tipada
  go_router: ^14.2.0

  # Banco local
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Export
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.0

  # Fotos
  image_picker: ^1.1.2

  # File picker (importar backup)
  file_picker: ^8.0.0

  # Util
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - CHANGELOG.md