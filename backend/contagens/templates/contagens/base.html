{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contagem HMB{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'contagens/styles.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">
      <span>HMB</span>
      <strong>Contagem de Estoque</strong>
    </a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="ghost" type="submit">Sair</button>
      </form>
    {% endif %}
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
